packages:
  - docs
  - playground

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Exact first-party prerelease certified in lupinum-dev/ginko-docs Actions run
# 33416335298. Remove after 2026-09-01 19:00 Europe/Vienna.
minimumReleaseAgeExclude: ["@lupinum/ginko-docs@0.4.0-rc.5"]

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: false
  vue-demi: true

overrides:
  # mkdist 2.4 requires the 0.1 line. Remove when its peer range accepts 0.2.
  vue-sfc-transformer: 0.1.1
  # Remove when fontless requires esbuild 0.28.1 or newer.
  'fontless>esbuild': 0.28.2
  # Remove when tsup and bundle-require require esbuild 0.28.1 or newer.
  'tsup>esbuild': 0.28.2
  'bundle-require>esbuild': 0.28.2
  # Remove when Vite requires esbuild 0.28.1 or newer.
  'vite>esbuild': 0.28.2
