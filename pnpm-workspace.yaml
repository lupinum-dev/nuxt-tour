# `.` makes the root package visible to Changesets next to the docs site and playground.
packages:
  - .
  - docs
  - playground

# Dependency quarantine: never install versions younger than 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Only these dependencies may run install scripts.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  # Its install script only checks for a native binding, which optional dependencies already provide.
  unrs-resolver: false
  vue-demi: true

overrides:
  # Nitro 2.12 static assets break with plugin-replace 6.0.3; see internals/migrations.md.
  'nitropack@2.12.0>@rollup/plugin-replace': 6.0.2
  # mkdist 2.4 requires the 0.1 line. Remove when its peer range accepts 0.2.
  vue-sfc-transformer: 0.1.1
  # Remove when fontless requires esbuild 0.28.1 or newer.
  'fontless>esbuild': 0.28.2
  # Remove when tsup and bundle-require require esbuild 0.28.1 or newer.
  'tsup>esbuild': 0.28.2
  'bundle-require>esbuild': 0.28.2
  # Remove when Vite requires esbuild 0.28.1 or newer.
  'vite>esbuild': 0.28.2
