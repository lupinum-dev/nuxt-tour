name: Package preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.18.0, package-manager-cache: false }
      - run: corepack enable pnpm && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: artifact
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm preview:pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-preview-${{ github.run_id }}
          path: .preview-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - id: publish
        run: pnpm exec pkg-pr-new publish --no-compact --comment=update --commentWithSha --no-template --packageManager=pnpm,npm .preview-artifacts/*.tgz
      - name: Verify hosted URL and bytes
        env:
          PREVIEW_SHA: ${{ steps.publish.outputs.sha }}
          PREVIEW_URLS: ${{ steps.publish.outputs.urls }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-preview.mjs "${{ steps.artifact.outputs.manifest }}"
