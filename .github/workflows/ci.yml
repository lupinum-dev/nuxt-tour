name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.18.0, package-manager-cache: false }
      - run: node scripts/verify-action-shas.mjs
      - run: corepack enable pnpm && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm release:verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate
          path: release-artifacts
          if-no-files-found: error
          retention-days: 90

  compatibility:
    name: ${{ matrix.framework }} ${{ matrix.framework-version }} / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.19.0
            framework: nuxt
            framework-version: 4.0.0
          - os: ubuntu-24.04
            node: 26.x
            framework: nuxt
            framework-version: ^4.5.2
          - os: ubuntu-24.04
            node: 22.19.0
            framework: vue
            framework-version: 3.5.0
          - os: windows-2025
            node: 24.11.0
            framework: vue
            framework-version: ^3.5.40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "${{ matrix.node }}", package-manager-cache: false }
      - run: node scripts/verify-action-shas.mjs
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm preview:pack
      - run: node scripts/verify-packed-consumer.mjs --preview --framework ${{ matrix.framework }} --framework-version ${{ matrix.framework-version }}
