name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.18.0, package-manager-cache: false }
      - run: node scripts/verify-action-shas.mjs
      - run: corepack enable pnpm && corepack prepare pnpm@11.21.0 --activate
      - if: github.event.schedule == '23 4 * * *'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: github.event.schedule == '23 4 * * *'
        run: pnpm check:dependencies
      - if: github.event.schedule != '23 4 * * *'
        run: pnpm install --frozen-lockfile
      - if: github.event.schedule != '23 4 * * *'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - if: github.event.schedule != '23 4 * * *'
        run: pnpm release:verify
      - if: github.event.schedule != '23 4 * * *'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release-artifacts
          if-no-files-found: error
          retention-days: 90

  compatibility:
    if: github.event.schedule != '23 4 * * *'
    name: ${{ matrix.framework }} ${{ matrix.framework-version }} / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.19.0
            framework: nuxt
            framework-version: 4.0.0
          - os: ubuntu-24.04
            node: 26.x
            framework: nuxt
            framework-version: ^4.5.2
          - os: ubuntu-24.04
            node: 22.19.0
            framework: vue
            framework-version: 3.5.0
          - os: windows-2025
            node: 24.11.0
            framework: vue
            framework-version: ^3.5.40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}", package-manager-cache: false }
      - run: node scripts/verify-action-shas.mjs
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm preview:pack
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec node scripts/verify-packed-consumer.mjs --preview --framework ${{ matrix.framework }} --framework-version ${{ matrix.framework-version }}
