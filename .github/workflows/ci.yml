name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml starts this workflow on the Version packages PR,
  # because pull requests opened with GITHUB_TOKEN trigger no workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the `verify` script in package.json.
        task: [lint, typecheck, test, 'test:types', 'test:bundle', build, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # lint compares the pull request with origin/main.
          fetch-depth: ${{ matrix.task == 'lint' && '0' || '1' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - if: matrix.task != 'audit'
        run: pnpm install --frozen-lockfile
      - if: matrix.task != 'audit'
        run: pnpm ${{ matrix.task }}
      # Only production advisories that reach a published package block releases.
      - if: matrix.task == 'audit'
        run: node scripts/audit-deps.mjs

  # Tours position cards, move focus and animate, so every engine and a phone viewport runs the journeys.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Installs the built and packed package into fresh Nuxt and Vue apps (`pnpm test:packed`),
  # at the oldest supported and the newest versions, and on Windows.
  packed:
    name: packed ${{ matrix.framework }} ${{ matrix.framework-version }} / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.19.0
            framework: nuxt
            framework-version: 4.0.0
          - os: ubuntu-24.04
            node: 26.x
            framework: nuxt
            framework-version: ^4.5.2
          - os: ubuntu-24.04
            node: 22.19.0
            framework: vue
            framework-version: 3.5.0
          - os: windows-2025
            node: 24.11.0
            framework: vue
            framework-version: ^3.5.40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Not every Node version in this matrix ships corepack.
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify-packed-consumer.mjs --framework ${{ matrix.framework }} --framework-version ${{ matrix.framework-version }}

  # The one required status check for the main branch ruleset.
  ci:
    name: ci
    if: always()
    needs: [check, browser, packed]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success; done
